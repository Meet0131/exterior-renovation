# A generic, single database configuration.

[alembic]
# Path to migration scripts, relative to this file.
script_location = %(here)s/alembic

# Prepend the backend directory so `app` imports resolve from any CWD.
prepend_sys_path = %(here)s

# Path separator for multi-path options.
path_separator = os

# Placeholder only; alembic/env.py uses app.config.settings.database_url.
sqlalchemy.url = driver://user:pass@localhost/dbname


[post_write_hooks]
# Post-write hooks are intentionally disabled.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
