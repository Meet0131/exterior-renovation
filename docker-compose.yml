services:
  postgres:
    image: postgres:16-alpine
    container_name: exterior-postgres
    environment:
      POSTGRES_DB: exterior
      POSTGRES_USER: exterior
      POSTGRES_PASSWORD: exterior
    ports:
      - "5433:5432"
    volumes:
      - exterior_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U exterior -d exterior"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  exterior_pgdata:
